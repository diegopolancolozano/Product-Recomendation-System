# ============================================================
#  Cloud Build — CI/CD Pipeline
#  Supermarket Analytics (FastAPI + Next.js → Cloud Run)
#
#  Variables de sustitucion:
#    _REGION        — region GCP         (default: us-central1)
#    _REPO          — Artifact Registry  (default: supermarket-analytics)
#    _API_SERVICE   — nombre Cloud Run API
#    _FRONT_SERVICE — nombre Cloud Run frontend
#    _API_URL       — URL publica del API (se actualiza tras el primer deploy)
#    _TAG           — tag de la imagen Docker (default: $SHORT_SHA en triggers,
#                     pasar "latest" en gcloud builds submit manual)
# ============================================================

substitutions:
  _REGION:        "us-central1"
  _REPO:          "supermarket-analytics"
  _API_SERVICE:   "supermarket-api"
  _FRONT_SERVICE: "supermarket-frontend"
  _API_URL:       "https://supermarket-api-tf5khoumqa-uc.a.run.app"
  _TAG:           "$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE

steps:

  # ── 1. Build imagen del backend ─────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-api"
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_TAG}"
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:latest"
      - -f
      - api/Dockerfile
      - .

  # ── 2. Push imagen del backend ──────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-api"
    waitFor: ["build-api"]
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}"

  # ── 3. Deploy backend a Cloud Run ───────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-api"
    waitFor: ["push-api"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_API_SERVICE}"
      - --image
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_TAG}"
      - --region
      - "${_REGION}"
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - "2Gi"
      - --cpu
      - "1"
      - --timeout
      - "120"
      - --port
      - "8080"
      - --set-env-vars
      - "DATA_DIR=/app/DataSet/DataSet"

  # ── 4. Build imagen del frontend ────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    waitFor: ["deploy-api"]
    args:
      - build
      - --build-arg
      - "NEXT_PUBLIC_API_URL=${_API_URL}"
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONT_SERVICE}:${_TAG}"
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONT_SERVICE}:latest"
      - -f
      - frontend/Dockerfile
      - frontend/

  # ── 5. Push imagen del frontend ─────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    waitFor: ["build-frontend"]
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONT_SERVICE}"

  # ── 6. Deploy frontend a Cloud Run ──────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    waitFor: ["push-frontend"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_FRONT_SERVICE}"
      - --image
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONT_SERVICE}:${_TAG}"
      - --region
      - "${_REGION}"
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - "512Mi"
      - --cpu
      - "1"
      - --port
      - "3000"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONT_SERVICE}:${_TAG}"
